<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Evolve 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 布局：左侧导航 + 顶栏 + 内容区；hash 路由切换页面。原型 v3：对应设计说明 docs/superpowers/specs/2026-10-28-open-evolve-design.md */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --sunken:#eef0ec; --hover:#e8ebe6;
  --fg:#161d1b; --fg2:#3d4844; --muted:#6c7773; --line:#e1e5e0; --line2:#d2d8d3;
  --accent:#0d8670; --accent-fg:#ffffff; --accent-soft:#dcf0ea;
  --amber:#c7731f; --amber-soft:#f8ead9; --red:#c8423b; --red-soft:#f7e1df;
  --t-claude:#d9714a; --t-codex:#3f74d8; --t-cursor:#9a63d1; --t-trae:#d4a524;
  --term-bg:#151b1a; --term-fg:#cfe0da;
  --shadow:0 1px 2px rgba(20,30,27,.05),0 8px 24px -12px rgba(20,30,27,.12);
  --sans:"Geist","Noto Sans SC",-apple-system,"PingFang SC",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1211; --panel:#151a19; --sunken:#1b2120; --hover:#212826;
  --fg:#e7ecea; --fg2:#bcc6c2; --muted:#87938f; --line:#232b29; --line2:#2e3835;
  --accent:#3fc7a5; --accent-fg:#06221b; --accent-soft:#16312a;
  --amber:#e6a25a; --amber-soft:#33261a; --red:#ec7a72; --red-soft:#3a1f1d;
  --t-claude:#e8875f; --t-codex:#6f9bf0; --t-cursor:#b88ae6; --t-trae:#e3bd4a;
  --term-bg:#0a0d0c; --term-fg:#cfe0da;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1211; --panel:#151a19; --sunken:#1b2120; --hover:#212826;
  --fg:#e7ecea; --fg2:#bcc6c2; --muted:#87938f; --line:#232b29; --line2:#2e3835;
  --accent:#3fc7a5; --accent-fg:#06221b; --accent-soft:#16312a;
  --amber:#e6a25a; --amber-soft:#33261a; --red:#ec7a72; --red-soft:#3a1f1d;
  --t-claude:#e8875f; --t-codex:#6f9bf0; --t-cursor:#b88ae6; --t-trae:#e3bd4a;
  --term-bg:#0a0d0c; --term-fg:#cfe0da;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.sp{flex:1}

/* ---------- 外壳 ---------- */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:2px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--fg);display:grid;place-items:center}
.brand-mark svg{width:16px;height:16px;stroke:var(--bg)}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.nav-label{font-size:11px;color:var(--muted);padding:12px 10px 6px;letter-spacing:.04em}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--fg2);text-decoration:none;font-weight:500}
.nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--hover)}
.nav a.cur{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.nav a .count{margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--mono)}
.nav a .badge{margin-left:auto;font-size:11px;background:var(--amber);color:#fff;border-radius:999px;padding:0 7px;font-weight:600;font-family:var(--mono)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-gap{flex:1}
.nav .ntag{font-size:10.5px;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:0 5px;font-weight:500}
.nav a .live{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
.side-foot{margin-top:14px;display:flex;flex-direction:column;gap:10px;padding:0 4px}
.sync{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:12px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.theme-switch{display:flex;background:var(--sunken);border-radius:8px;padding:3px}
.theme-switch button{flex:1;border:0;background:none;padding:4px;border-radius:6px;font-size:12px;color:var(--muted)}
.theme-switch button.on{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12px;text-align:left;padding:0 6px}
.linkbtn:hover{color:var(--accent)}

.maincol{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line)}
.top h1{font-size:17px;margin:0;letter-spacing:-.01em;font-weight:600}
.top .sub{font-size:12px;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;width:250px}
.search svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{border:0;background:none;outline:none;width:100%;font-size:13px}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:0 5px}
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:7px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{opacity:.88}
.btn.accent{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 10px;font-size:12px}
.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#view{flex:1;overflow:auto;padding:24px 28px 48px}
#view.flush{padding:0;overflow:hidden}
.page{display:flex;flex-direction:column;gap:18px;max-width:1280px;margin:0 auto;animation:fadein .25s ease}
@keyframes fadein{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px 0}
.card-h h3{margin:0;font-size:14px;font-weight:600}
.card-b{padding:14px 18px 18px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
.example{font-size:11px;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:1px 9px;font-weight:500}
.sec-t{font-size:12px;color:var(--muted);font-weight:500}
.hint{font-size:12.5px;color:var(--muted);margin:0}

.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .lbl{font-size:12.5px;color:var(--muted)}
.kpi .val{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:12px;font-weight:500}
.up{color:var(--accent)} .down{color:var(--red)}
.kpi svg.spark{position:absolute;right:14px;bottom:14px;width:96px;height:34px}

.banner{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);flex-wrap:wrap}
.banner .meter{flex:1;min-width:160px}
.track{height:8px;background:var(--sunken);border-radius:999px;overflow:hidden}
.track span{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart svg{width:100%;height:220px;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--mono)}
.chart .grid-line{stroke:var(--line);stroke-dasharray:2 3}
.chart g.col:hover rect.bar{opacity:.8}
.chart g.col rect.hit{fill:transparent}
#tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:8px 10px;border-radius:8px;opacity:0;transition:opacity .12s;z-index:50;min-width:130px}
#tip .row{display:flex;justify-content:space-between;gap:14px}
.share-row{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:13px;padding:6px 0}

.insight{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.insight:first-child{border-top:0;padding-top:2px}
.insight .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700}
.insight p{margin:0;font-size:13px;color:var(--fg2)}
.insight b{color:var(--fg);font-weight:600}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--sunken)}
table.t tr.bad td{background:var(--red-soft)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border-radius:999px;padding:1px 9px;background:var(--sunken);color:var(--fg2);font-weight:500;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.chip{border:1px solid var(--line2);background:none;border-radius:999px;padding:2px 10px;font-size:12px;color:var(--fg2)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:hover:not(.on){background:var(--hover)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- 运行 ---------- */
.split{display:grid;grid-template-columns:370px minmax(0,1fr);gap:18px;align-items:start}
.list{display:flex;flex-direction:column;max-height:calc(100vh - 150px);overflow:auto}
.filters{display:flex;flex-direction:column;gap:8px;padding:14px 14px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.s-item{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent;text-align:left;background:none;width:100%}
.s-item:hover{background:var(--sunken)}
.s-item.cur{background:var(--sunken);border-left-color:var(--accent)}
.s-item .t1{font-weight:600;font-size:13.5px}
.s-item .t2{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.detail{display:flex;flex-direction:column;gap:18px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:22px;padding:16px 18px;border-top:1px solid var(--line)}
.meta div{display:flex;flex-direction:column;gap:2px}
.meta span{font-size:11.5px;color:var(--muted)}
.meta b{font-weight:500;font-size:13px;font-family:var(--mono)}
.summary{background:var(--accent-soft);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.summary h4{margin:0;font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.02em}
.summary p{margin:0;color:var(--fg2)}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.ent{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:2px 8px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.ent:hover{border-color:var(--accent);color:var(--accent)}
.ent i{width:7px;height:7px;border-radius:2px;display:inline-block}
.msgs{display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:12px}
.av{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff}
.av.u{background:var(--sunken);color:var(--fg2)}
.msg .c{min-width:0;flex:1}
.msg .who{font-size:12px;color:var(--muted);margin-bottom:3px;display:flex;gap:8px;align-items:center}
.msg .txt{color:var(--fg2);white-space:pre-wrap}
.msg.hl .txt{background:var(--amber-soft);border-radius:6px;padding:2px 6px;margin-left:-6px}
.step{font-family:var(--mono);font-size:12px;background:var(--sunken);border-radius:8px;padding:8px 10px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border:0;width:100%;text-align:left}
.step:hover{color:var(--fg)}
.step .row{display:flex;gap:8px;align-items:center}
.step pre{margin:0;white-space:pre-wrap;color:var(--fg2)}
.memref{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--panel);text-align:left;width:100%}
.memref:hover{border-color:var(--accent)}

/* ---------- 记忆 ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;font-size:13.5px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg)}
.tabs .badge{font-size:11px;background:var(--amber);color:#fff;border-radius:999px;padding:0 6px;font-family:var(--mono)}
.mem{display:flex;gap:14px;padding:16px 18px;border-top:1px solid var(--line);align-items:flex-start}
.mem:first-child{border-top:0}
.mem .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mem .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mem .title{font-size:14.5px;font-weight:600}
.mem textarea{width:100%;border:1px solid var(--accent);border-radius:8px;padding:6px 9px;background:var(--panel);resize:vertical;font-size:14px}
.quote{font-size:12.5px;color:var(--fg2);border-left:3px solid var(--line2);padding:2px 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.quote button{border:0;background:none;color:var(--accent);font-family:var(--mono);font-size:11.5px;padding:0}
.mem .acts{display:flex;gap:6px;flex-wrap:wrap}
.kind{font-size:11px;font-weight:600;border-radius:5px;padding:0 7px}
.cbx{width:16px;height:16px;margin-top:3px;accent-color:var(--accent)}
.searchbig{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:10px 14px}
.searchbig input{flex:1;border:0;outline:none;background:none;font-size:15px}
.searchbig svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.timeline{display:flex;flex-direction:column;padding:4px 0 4px 8px}
.tl{display:grid;grid-template-columns:70px 18px 1fr;gap:10px;align-items:start;padding:0 0 18px}
.tl .date{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px;text-align:right}
.tl .rail{position:relative;height:100%;display:flex;justify-content:center}
.tl .rail::before{content:"";position:absolute;top:14px;bottom:-18px;width:2px;background:var(--line)}
.tl:last-child .rail::before{display:none}
.tl .rail i{width:12px;height:12px;border-radius:50%;margin-top:4px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line2);position:relative}

/* 图谱 */
.graph-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;height:calc(100vh - 210px);min-height:500px}
.graph-card{position:relative;overflow:hidden}
.graph-card svg{width:100%;height:100%;display:block;cursor:grab}
.graph-tools{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.graph-tools > *{pointer-events:auto}
.gtype{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:12px}
.gtype i{width:8px;height:8px;border-radius:50%}
.gtype.off{opacity:.45}
.graph-hint{position:absolute;bottom:12px;left:14px;font-size:11.5px;color:var(--muted)}
.zoom{position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.zoom button{border:0;background:none;width:30px;height:28px;font-size:15px}
.zoom button:hover{background:var(--hover)}
.node text{font-size:11px;fill:var(--fg2);paint-order:stroke;stroke:var(--panel);stroke-width:3px;pointer-events:none;font-family:var(--sans)}
.node circle{stroke:var(--panel);stroke-width:2;cursor:pointer}
.node.sel circle{stroke:var(--fg);stroke-width:2.5}
.link{stroke:var(--line2);stroke-width:1.2}
.link.st{stroke-width:1.2}
.node.k-domain text{font-size:13px;font-weight:600;fill:var(--fg)}
.node.k-topic text{font-size:12px;font-weight:600;fill:var(--fg)}
.node.k-topic circle{stroke-width:2}
.node.ghost circle{stroke-dasharray:2.5 2;stroke-width:2}
.link:not(.st){stroke-dasharray:3 3;opacity:.7}
.node.ghost text{fill:var(--muted)}
.graph-tools .seg button{font-size:12px}
.graph-tools .seg .lx{margin-left:6px;color:var(--muted);padding:0 2px}.graph-tools .seg .lx:hover{color:var(--red)}
.lensq{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:3px 4px 3px 12px;flex-wrap:wrap}
.lensq input{border:0;outline:0;background:none;font-size:12.5px;width:190px;color:var(--fg)}
.lensq button{border:0;background:var(--sunken);border-radius:999px;font-size:11.5px;padding:3px 9px;color:var(--fg2)}.lensq button:hover{color:var(--fg)}
.evalbox{display:flex;flex-direction:column;gap:8px;background:var(--sunken);border-radius:10px;padding:11px 12px;font-size:12.5px}
.evc{display:flex;gap:8px;align-items:flex-start}.evc .pill{flex:none}.evc b{font-weight:500;display:block}.evc small{color:var(--muted);font-size:11.5px}
.gadd{border:0;background:none;color:var(--muted);font-size:12px;padding:3px 6px}.gadd:hover{color:var(--fg)}
.panel .pk{font-size:11.5px;font-weight:600;color:var(--muted)}
.pstat{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}.pstat b{color:var(--fg);font-weight:600;margin-right:2px}
.pk-item{display:flex;flex-direction:column;gap:4px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.pk-item:last-child{border-bottom:0}.pk-item .kind{align-self:flex-start}.pk-item .m{font-size:11.5px;color:var(--muted)}
.k-doms{display:flex;flex-direction:column;gap:8px;margin:2px 0 6px}.k-doms > div{display:flex;gap:10px;align-items:baseline}
.k-doms .lbl{font-size:12px;color:var(--muted);flex:none;width:96px}
.dim{opacity:.15}
.panel{display:flex;flex-direction:column;overflow:auto}
.panel .card-b{display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:20px;letter-spacing:-.01em}
.panel p{margin:0;color:var(--fg2)}
.link-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px;border:0;background:none;width:100%;text-align:left}
.link-row:hover{background:var(--sunken)}
.link-row .rel{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}

/* ---------- Agent 工作台：任务列表 | 对话 | 工作区（可收起 / 最大化） ---------- */
[hidden]{display:none!important}
.agent{display:grid;grid-template-columns:220px minmax(0,1fr) 420px;height:100%}
.agent.ws-off{grid-template-columns:230px minmax(0,1fr)}
.agent.ws-off .a-panel{display:none}
.agent.ws-max{grid-template-columns:230px minmax(0,1fr)}
.agent.ws-max .a-main{display:none}
.a-tasks{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.a-task{border:0;background:none;text-align:left;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.a-task:hover{background:var(--hover)}
.a-task.cur{background:var(--panel);box-shadow:var(--shadow)}
.a-task b{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-task small{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.a-sec{font-size:11.5px;color:var(--muted);padding:10px 10px 2px}
.a-note{font-size:11.5px;color:var(--muted);line-height:1.6;padding:12px 10px 0;margin:0}
.a-note a{color:var(--fg2);text-decoration:underline;text-underline-offset:2px}
.a-main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.a-panel,.a-tasks{min-height:0}
.a-head{display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);min-height:55px}
.a-head h2{margin:0;font-size:15px;font-weight:600;margin-right:4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-head .pill,.a-head .btn{flex:none}
.icbtn{width:30px;height:30px;flex:none;border-radius:8px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;color:var(--fg2)}
.icbtn:hover{background:var(--hover)}
.icbtn.on{border-color:var(--accent);color:var(--accent)}
.icbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icbtn.round{border-radius:50%}

.thread{flex:1;min-height:0;overflow:auto;padding:22px 24px 12px}
.thread-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.umsg{align-self:flex-end;background:var(--sunken);border-radius:14px;padding:9px 13px;max-width:80%;white-space:pre-wrap;color:var(--fg)}
.umsg .tag,.amsg .tag{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
.amsg{display:flex;flex-direction:column;gap:10px}
.amsg .who{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.amsg .who b{color:var(--fg);font-weight:600;font-size:13.5px}
.amsg .who .mark{width:20px;height:20px;border-radius:6px;background:var(--fg);display:grid;place-items:center}
.amsg .who .mark svg{width:12px;height:12px;stroke:var(--bg);fill:none;stroke-width:2}
.amsg .x{white-space:pre-wrap;color:var(--fg2)}
.sg{display:flex;flex-direction:column;gap:6px}
.sg-h{display:flex;gap:8px;align-items:center;border:0;background:none;padding:2px 0;font-size:13.5px;color:var(--fg2);text-align:left;width:100%}
.sg-h .n{font-size:11.5px;color:var(--muted)}
.sg-h .chev{color:var(--muted);font-size:11px;transition:transform .15s}
.sg-h .chev.open{transform:rotate(90deg)}
.sg-h .fork{margin-left:auto;opacity:0;font-size:12px;color:var(--muted);border:0;background:none;padding:2px 6px;border-radius:6px}
.sg:hover .fork,.sg-h .fork:focus-visible{opacity:1}
.sg-h .fork:hover{background:var(--hover);color:var(--fg)}
.sg-b{display:flex;flex-direction:column;gap:6px;margin-left:7px;padding-left:15px;border-left:2px solid var(--line)}
.trow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 11px;font-size:13px;cursor:pointer;width:100%;text-align:left}
.trow:hover{border-color:var(--line2);background:var(--sunken)}
.trow.sel{border-color:var(--accent)}
.trow .cat{font-family:var(--mono);font-size:11px;color:var(--muted);width:34px}
.trow .b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .lv{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 4px}
.st{width:16px;height:16px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;border-radius:50%}
.st.ok{background:var(--accent-soft);color:var(--accent)}
.st.err{background:var(--red-soft);color:var(--red)}
.st.run{border:2px solid var(--line2);border-top-color:var(--accent);animation:spin .8s linear infinite}
.st.wait{background:var(--amber-soft);color:var(--amber)}
.st.todo{border:2px solid var(--line2)}
.confirm{border:1px solid var(--amber);background:var(--amber-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.confirm code,.authc code{font-family:var(--mono);font-size:12.5px;background:var(--panel);border-radius:6px;padding:4px 8px;display:block;overflow-wrap:anywhere}
.confirm .row,.authc .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.authc{border:1px solid var(--t-codex);background:color-mix(in srgb,var(--t-codex) 9%,var(--panel));border-radius:12px;padding:12px 14px;display:flex;gap:14px}
.authc .qr{flex:none;width:96px;height:96px;background:#fff;border-radius:8px;padding:6px}
.authc .qr svg{width:100%;height:100%;display:block}
.authc .body{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1}
.authc a{color:var(--t-codex);font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.layer{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid currentColor}
.layer.l-user{color:var(--t-codex)}
.layer.l-app{color:var(--amber)}
.precheck{border:1px dashed var(--line2);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--fg2);display:flex;flex-direction:column;gap:4px}
.precheck .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.art{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;text-align:left;width:100%}
.art:hover{background:var(--sunken)}
.art .ic{width:30px;height:34px;flex:none;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 10px var(--mono)}
.art b{font-weight:500;font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art small{color:var(--muted);font-size:12px}
.art.all{justify-content:center;color:var(--fg2);font-size:13px}
.done-bar{display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap}
.done-bar .ok{color:var(--accent);font-weight:500;margin-right:6px}
.done-bar .sep{width:1px;height:16px;background:var(--line2);margin:0 4px}
.rate{display:flex;gap:6px;align-items:center;margin-left:auto;color:var(--muted);font-size:12.5px}
.rate button{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:2px 10px;font-size:12.5px}
.rate button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tobottom{position:absolute;right:28px;bottom:178px;z-index:2;box-shadow:var(--shadow)}

.dock{padding:0 24px 12px}
.dock-in{max-width:760px;margin:0 auto;border:1px solid var(--line2);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);position:relative}
.pbar{display:flex;gap:10px;align-items:center;padding:8px 12px;font-size:13px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;border-radius:14px 14px 0 0}
.pbar:hover{background:var(--sunken)}
.pbar .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:36px;height:22px;flex:none;border-radius:4px;background:var(--term-bg);padding:4px;display:flex;flex-direction:column;gap:2px}
.thumb i{display:block;height:2px;border-radius:2px;background:#7ee2c4;opacity:.7}
.plist{padding:6px 14px 10px;display:flex;flex-direction:column;gap:7px;font-size:13px;border-bottom:1px solid var(--line)}
.plist .h{font-size:12px;color:var(--muted)}
.plist .r{display:flex;gap:8px;align-items:center;color:var(--fg2)}
.plist .r.cur{color:var(--fg);font-weight:500}
.umsg.ij{border:1px dashed var(--line2);background:var(--panel)}
.umsg.ij.merged{border-style:solid;background:var(--sunken)}
.ij-st{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:11.5px;color:var(--muted);margin-top:4px}
.ij-st .spin{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line2);border-top-color:var(--accent);animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.ij-st .linkbtn{padding:0;font-size:11.5px}
.qtray{border-bottom:1px solid var(--line);padding:8px 12px 8px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.qtray .qh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.qtray .qh b{color:var(--fg2);font-weight:500}
.qi{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:8px}
.qi:hover{background:var(--sunken)}
.qi .no{width:18px;height:18px;flex:none;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.qi .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg2)}
.qi .ops{display:flex;gap:2px;opacity:.55}
.qi:hover .ops,.qi:focus-within .ops{opacity:1}
.qi .ops button{border:0;background:none;border-radius:6px;padding:2px 6px;font-size:12px;color:var(--muted)}
.qi .ops button:hover{background:var(--hover);color:var(--fg)}
.qtray .qf{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);padding-top:2px}
.qtray .qf .seg button{padding:2px 9px;font-size:11.5px}
.sendgrp{display:flex;gap:6px;align-items:center}
.sendgrp .kbd{margin-left:4px;border-color:currentColor;opacity:.6;color:inherit}
.composer{display:flex;flex-direction:column;gap:6px;padding:10px 12px}
.composer textarea{border:0;outline:none;background:none;resize:none;min-height:40px;max-height:140px;padding:2px}
.ctools{display:flex;gap:6px;align-items:center}
.chip{display:flex;gap:6px;align-items:center;border:1px solid var(--line2);background:none;border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--fg2)}
.chip:hover{background:var(--hover)}
.conn-pop{position:absolute;left:8px;bottom:calc(100% + 8px);width:360px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.14),var(--shadow);z-index:5;display:flex;flex-direction:column;overflow:hidden}
.cp-h{display:flex;gap:8px;align-items:baseline;padding:12px 14px 6px}
.cp-h b{font-size:13.5px;font-weight:600}
.cp-h span{font-size:12px;color:var(--muted)}
.cp-list{display:flex;flex-direction:column;padding:2px 6px 6px}
.cp-sec{font-size:11.5px;color:var(--muted);padding:8px 8px 4px}
.cp-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px;border-radius:10px}
.cp-row:hover{background:var(--sunken)}
.cp-row.off .cp-ic,.cp-row.off .cp-n{opacity:.5}
.cp-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11.5px;font-weight:600;color:#fff;grid-row:span 2}
.cp-n{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:500;min-width:0}
.cp-n .ty{font-size:10.5px;font-weight:500;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
.cp-d{font-size:11.5px;color:var(--muted);grid-column:2/4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-warn{grid-column:2/4;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--amber);background:color-mix(in srgb,var(--amber) 9%,transparent);border-radius:8px;padding:5px 6px 5px 9px;margin-top:2px}
.cp-warn span{flex:1;min-width:0}
.cp-warn code{font-family:var(--mono);font-size:11.5px}
.cp-warn .btn{flex:none}
.cp-f{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 14px;font-size:12px;color:var(--muted)}
.cp-f .linkbtn{padding:0;font-size:12px}
.cp-f .linkbtn+.linkbtn{margin-left:auto}
.chip .wdot{width:6px;height:6px;border-radius:50%;background:var(--amber)}
.foot-meta{max-width:760px;margin:8px auto 0;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.foot-meta .track{width:90px;height:6px}
.injected{max-width:760px;margin:6px auto 0;display:flex;flex-direction:column;gap:6px}
.injected div{font-size:12.5px;color:var(--fg2);display:flex;gap:8px}

.a-panel{display:flex;flex-direction:column;min-width:0;background:var(--bg);border-left:1px solid var(--line)}
.ws-tabs{display:flex;gap:4px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);min-height:47px}
.ws-list{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
.ws-tab{display:flex;gap:6px;align-items:center;border:1px solid transparent;background:none;border-radius:8px;padding:4px 10px;font-size:12.5px;color:var(--muted);white-space:nowrap;flex:none}
.ws-tab:hover{background:var(--hover)}
.ws-tab.on{background:var(--panel);border-color:var(--line);color:var(--fg)}
.ws-tab .k{font-family:var(--mono);font-size:10.5px;opacity:.8}
.a-panel .pbody{flex:1;overflow:auto;padding:14px}
.term{background:var(--term-bg);color:var(--term-fg);font-family:var(--mono);font-size:12px;border-radius:10px;padding:12px 14px;white-space:pre-wrap;line-height:1.55;margin:0;min-height:120px}
.term .cmd{color:#7ee2c4}
.term .bad{color:#ff9b93}
.filebox{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.filebox .fh{font-family:var(--mono);font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--sunken);display:flex;gap:8px}
.filebox pre{margin:0;padding:12px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--fg2)}
.ws-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px;text-align:center;padding:20px}
.follow{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* 设置：连接器 / 安全 */
.conn-card{padding:16px;display:flex;flex-direction:column;gap:12px}
.conn-card .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.conn-card .lbl{font-size:12px;color:var(--muted);width:68px;flex:none}
.scope{font-family:var(--mono);font-size:11.5px;border-radius:6px;padding:1px 7px;background:var(--sunken);color:var(--fg2)}
.miss{display:flex;gap:8px;align-items:center;border-radius:8px;padding:7px 10px;background:var(--amber-soft);font-size:12.5px;flex-wrap:wrap}
.miss .for{color:var(--muted)}
.miss .btn{margin-left:auto}
.lvl{font-family:var(--mono);font-weight:600}
.diff{font-family:var(--mono);font-size:12.5px;background:var(--sunken);border-radius:8px;padding:10px 12px;margin:0;white-space:pre-wrap;line-height:1.6}
.diff .add{color:var(--accent)}
.diff .warn{color:var(--amber)}

/* ---------- 设置 ---------- */
.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.src-card{padding:16px;display:flex;flex-direction:column;gap:12px}
.src-top{display:flex;gap:12px;align-items:center}
.logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12.5px;color:#fff;flex:none}
.src-top b{display:block;font-size:14px}
.src-top small{color:var(--muted);font-size:12px}
.path{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--sunken);border-radius:6px;padding:5px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-stats{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.src-stats b{color:var(--fg);font-family:var(--mono);font-weight:500}
.switch{position:relative;width:36px;height:21px;flex:none;margin-left:auto;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line2);border-radius:999px;transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;width:15px;height:15px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(15px)}
.switch input:disabled+span{opacity:.6;cursor:not-allowed}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.profile{padding:16px;display:flex;flex-direction:column;gap:10px}
.profile .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cap{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-radius:4px;padding:0 6px;color:var(--fg2)}
select.sel{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:5px 8px;font-size:13px}
select.sel.bad{border-color:var(--red);color:var(--red)}
input.txt{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:6px 9px;font-size:13px;font-family:var(--mono)}
.codeblk{font-family:var(--mono);font-size:12px;background:var(--sunken);border-radius:10px;padding:14px 16px;white-space:pre;overflow:auto;color:var(--fg2);margin:0}
.opt{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line)}
.opt:first-child{border-top:0}
.opt .info{flex:1;min-width:0}
.opt .info small{display:block;color:var(--muted);font-size:12px}
.form{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;align-items:center;text-align:left;width:100%}
.form label{font-size:13px;color:var(--muted)}
.form .caps{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
.form .caps label{color:var(--fg2);display:flex;gap:5px;align-items:center}

/* 报告 */
.report-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
.doc{padding:34px 42px 40px;max-width:820px}
.doc .eyebrow{font-size:12px;color:var(--muted);font-family:var(--mono)}
.doc h2{font-size:24px;margin:6px 0 4px;letter-spacing:-.02em}
.doc h3{font-size:15px;margin:26px 0 10px}
.doc p{color:var(--fg2);margin:0 0 8px;max-width:66ch}

function drawChart(){
  const el = $('#chart'); if(!el) return;
  const days = DAILY.slice(-({day:7,week:7,month:30}[state.period]||7));
  const W = el.clientWidth - 36, H = 220, pad = {l:30,b:24,t:8};
  const max = Math.max(...days.map(d=>CHART_KEYS.reduce((s,t)=>s+d[t],0)));
  const nice = Math.ceil(max/10)*10, ih = H-pad.b-pad.t, bw = (W-pad.l)/days.length;
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=4;i++){ const y = pad.t + ih - ih*i/4; s += `<line class="grid-line" x1="${pad.l}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pad.l-8}" y="${y+3}" text-anchor="end">${nice*i/4}</text>`; }
  days.forEach((d,i) => {
    let y = pad.t + ih; const x = pad.l + i*bw + bw*.18, w = bw*.64;
    s += `<g class="col" data-i="${i}">`;
    CHART_KEYS.forEach(k => { const h = d[k]/nice*ih; y -= h; if(h>0) s += `<rect class="bar" x="${x}" y="${y}" width="${w}" height="${h}" fill="${SRC[k].c}"/>`; });
    s += `<rect class="hit" x="${pad.l+i*bw}" y="${pad.t}" width="${bw}" height="${ih}"/></g>`;
    const every = days.length > 14 ? 5 : days.length > 7 ? 2 : 1;
    if(i % every === 0 || i === days.length-1) s += `<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${md(d.d)}</text>`;
  });
  el.innerHTML = s + '</svg>';
  el.querySelectorAll('g.col').forEach(g => { const d = days[+g.dataset.i];
    g.addEventListener('mousemove', e => showTip(e, `<b>${md(d.d)}</b>${CHART_KEYS.map(k=>`<div class="row"><span>${SRC[k].name}</span><span>${d[k]}</span></div>`).join('')}`));
    g.addEventListener('mouseleave', hideTip); });
}

function graphModel(lid){
  const L = lensById(lid), cids = new Set(L.groups.flatMap(g=>g.cs));
  const cons = [...cids].map(conceptById);
  const ghosts = L.auto ? [...new Set(CLINKS.flatMap(([a,b])=>cids.has(a)&&!cids.has(b)?[b]:cids.has(b)&&!cids.has(a)?[a]:[]))].map(conceptById) : [];
  const colorOf = cid => (L.groups.find(g=>g.cs.includes(cid)) || {c:topicById(conceptById(cid).topic).c}).c;
  const nodes = [{id:'lens:'+lid,kind:'domain',label:L.name},
    ...L.groups.map(g=>({id:g.id,kind:'topic',label:g.name,c:g.c})),
    ...cons.map(c=>({id:c.id,kind:'concept',label:c.label,c:colorOf(c.id),n:conceptMems(c.id).length})),
    ...ghosts.map(c=>({id:c.id,kind:'concept',ghost:true,label:c.label,c:topicById(c.topic).c,n:0}))];
  const links = [...L.groups.map(g=>({source:'lens:'+lid,target:g.id,st:true})), ...L.groups.flatMap(g=>g.cs.map(c=>({source:g.id,target:c,st:true}))),
    ...CLINKS.filter(([a,b])=>(cids.has(a)||cids.has(b)) && (L.auto || (cids.has(a)&&cids.has(b)))).map(([a,b,rel])=>({source:a,target:b,rel}))];
  return {nodes, links};
}

function drawGraph(){
  const svgEl = $('#gsvg'); if(!svgEl) return;
  if(typeof d3 === 'undefined'){ svgEl.outerHTML = '<div style="padding:80px 24px;text-align:center" class="muted">图谱需要联网加载 d3。</div>'; return; }
  const W = svgEl.clientWidth, H = svgEl.clientHeight, cx = W/2, cy = H/2+20;
  if(!lensById(state.gDom)) state.gDom = 'agent';
  if(!lensHas(state.gDom, state.selNode)) state.selNode = 'lens:'+state.gDom;
  const M = graphModel(state.gDom), nodes = M.nodes.map(n=>({...n})), links = M.links.map(l=>({...l}));
  const rx = W/2 - 110, ry = (H-110)/2;
  /* 主题均匀排在内圈，知识点朝所属主题的方向排在外圈，跨领域的知识点排在最外圈 */
  const topics = nodes.filter(n=>n.kind==='topic'), ang = {};
  topics.forEach((t,i) => { ang[t.id] = -Math.PI/2 + i*2*Math.PI/topics.length; t.fx = cx + Math.cos(ang[t.id])*rx*.42; t.fy = cy + Math.sin(ang[t.id])*ry*.42; });
  const L = lensById(state.gDom);
  nodes.forEach(n => { n.r = n.kind==='domain' ? 16 : n.kind==='topic' ? 10 : n.ghost ? 6 : 5 + Math.min(n.n,4)*1.6;
    if(n.kind==='domain'){ n.fx = cx; n.fy = cy; }
    if(n.kind==='concept'){ let a;
      if(n.ghost){ const nb = CLINKS.find(([x,y])=>(x===n.id&&L.groups.some(g=>g.cs.includes(y)))||(y===n.id&&L.groups.some(g=>g.cs.includes(x))));
        const inner = nb[0]===n.id?nb[1]:nb[0]; a = ang[L.groups.find(g=>g.cs.includes(inner)).id] + .25; }
      else { const G = L.groups.filter(g=>g.cs.includes(n.id)), gs = G.map(g=>ang[g.id]); a = Math.atan2(gs.reduce((s,x)=>s+Math.sin(x),0), gs.reduce((s,x)=>s+Math.cos(x),0));
        if(G.length===1){ const sib = G[0].cs.filter(c=>L.groups.filter(g=>g.cs.includes(c)).length===1), k = sib.indexOf(n.id); a += (k-(sib.length-1)/2) * Math.min(.32, 1.6/Math.max(L.groups.length,1)/Math.max(sib.length-1,1)*1.2); } }
      const sibs = L.groups.find(g=>g.cs.includes(n.id))?.cs || [], R = n.ghost ? 1 : sibs.length>2 && sibs.indexOf(n.id)%2 ? .95 : .76; n.tx = cx + Math.cos(a)*rx*R; n.ty = cy + Math.sin(a)*ry*R; n.x = n.tx; n.y = n.ty; } });
  const projHit = n => !state.gProj || n.kind!=='concept' || conceptProjects(n.id).includes(state.gProj);
  const svg = d3.select(svgEl); svg.selectAll('*').remove();
  const root = svg.append('g');
  const zoom = d3.zoom().scaleExtent([.4,3]).on('zoom', e => root.attr('transform', e.transform));
  svg.call(zoom).on('dblclick.zoom', null);
  const link = root.append('g').selectAll('line').data(links).join('line').attr('class', l => 'link'+(l.st?' st':''));
  const node = root.append('g').selectAll('g').data(nodes).join('g').attr('class', n => `node k-${n.kind}${n.ghost?' ghost':''}`);
  node.append('circle').attr('r',d=>d.r)
    .attr('fill',d=> d.kind==='domain' ? 'var(--fg)' : d.ghost ? 'var(--panel)' : d.kind==='topic' ? `color-mix(in srgb, ${d.c} 22%, var(--panel))` : d.c)
    .style('stroke',d=> d.kind==='topic' || d.ghost ? d.c : null);
  const left = d => (d.fx ?? d.tx ?? cx) < cx - 4;
  node.append('text').text(d=>d.label).attr('x',d=>left(d)?-(d.r+5):d.r+5).attr('text-anchor',d=>left(d)?'end':'start').attr('y',4);
  const nb = id => new Set([id, ...links.filter(l=>l.source.id===id||l.target.id===id).flatMap(l=>[l.source.id,l.target.id])]);
  const mark = () => { node.classed('sel', d=>d.id===state.selNode); node.classed('dim', d=>!projHit(d)); link.classed('dim', l=>!projHit(l.source)||!projHit(l.target)); };
  node.on('mouseenter', (e,d) => { const s=nb(d.id); node.classed('dim',x=>!s.has(x.id)); link.classed('dim',l=>l.source.id!==d.id&&l.target.id!==d.id); })
      .on('mouseleave', mark)
      .on('click', (e,d) => { if(d.ghost){ state.gDom = domOfNode(d.id); state.selNode = d.id; render(); return; } state.selNode = d.id; mark(); renderPanel(); });
  node.call(d3.drag().on('start',(e,d)=>{ if(!e.active) sim.alphaTarget(.25).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag',(e,d)=>{ d.fx=e.x; d.fy=e.y; }).on('end',(e,d)=>{ if(!e.active) sim.alphaTarget(0); if(d.kind==='concept'){ d.fx=null; d.fy=null; } }));
  if(sim) sim.stop();
  sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d=>d.id).strength(0))
    .force('x', d3.forceX(d=>d.tx ?? d.x).strength(d=>d.kind==='concept'?.5:0))
    .force('y', d3.forceY(d=>d.ty ?? d.y).strength(d=>d.kind==='concept'?.5:0))
    .force('collide', d3.forceCollide(d=>d.kind==='concept'?Math.max(d.r+14, d.label.length*5.5):d.r+14).strength(.7))
    .on('tick', () => { link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y); node.attr('transform',d=>`translate(${d.x},${d.y})`); });
  mark();
  gApi = { zoomBy: k => k ? svg.transition().duration(250).call(zoom.scaleBy, k) : svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity),
    focus: id => { const n = nodes.find(x=>x.id===id); if(!n) return; state.selNode=id; mark(); renderPanel();
      svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(W/2,H/2).scale(1.4).translate(-n.x,-n.y)); } };
}

    if(s.pre) agEmit({t:'pre'});
    if(s.plan!==undefined) agSetPlan(s.plan);
    if(s.tool){ const e = agEmit({t:'tool',...s.tool,st:'run'}); agRender();
      AG.timer = setTimeout(()=>{ if(AG.status!=='running') return; e.st='ok'; AG.cost+=s.cost; AG.tokens+=s.tokens; agDrainInterrupt(); agRender(); agStep(i+1); }, 700); return; }
    if(s.confirm){ const e = agEmit({t:'tool',...s.confirm,st:'wait'}); AG.status='waiting'; AG.wait={kind:'confirm',e}; agRender(); return; }
    agRender(); agStep(i+1);
  }, s.wait);
}
/* 插话：进入收件箱，在当前工具调用返回后、下一次模型调用前并入上下文；并入前可撤回 */
function agDrainInterrupt(){
  AG.events.filter(e=>e.t==='msg' && e.r==='u' && e.ij==='pending').forEach(e => { e.ij='merged'; e.at = Math.max(0, AG.planCur)+1;
    agEmit({t:'msg',r:'a',x:`收到插话：“${e.x}”。已并入上下文，接下来的步骤会按这个调整。`}); });
}
function agUndoInterject(id){
  const e = AG.events.find(x=>x.id===id); if(!e || e.ij!=='pending') return;
  AG.events.splice(AG.events.indexOf(e), 1); const ta = $('#ag-input'); ta.value = e.x; ta.focus(); agRender(); toast('已撤回，内容放回输入框');
}
/* 排队：本次运行结束后，按顺序作为新一轮发送 */
function agQueueOp(op, id){
  const k = AG.queued.findIndex(q=>q.id===id); if(k<0) return; const q = AG.queued[k];
  if(op==='up' && k>0){ AG.queued.splice(k,1); AG.queued.splice(k-1,0,q); }
  else if(op==='del'){ AG.queued.splice(k,1); }
  else if(op==='edit'){ AG.queued.splice(k,1); const ta = $('#ag-input'); ta.value = q.x; ta.focus(); }
  else if(op==='now'){ AG.queued.splice(k,1); agEmit({t:'msg',r:'u',x:q.x,tag:'插话',ij:'pending'}); toast('已改为插话：会在当前操作结束后并入'); }
  agRender();
}
function agDrainQueue(){
  if(!AG.queued.length || !AG.qAuto || AG.status==='running' || AG.status==='waiting') { agRender(); return; }
  const q = AG.queued.shift(); AG.status='running';
  agEmit({t:'msg',r:'u',x:q.x,tag:'排队消息'}); agRender();
  AG.timer = setTimeout(()=>{ agEmit({t:'msg',r:'a',x:`开始处理排队的消息：“${q.x}”。（原型到此为止）`}); AG.status='completed'; agRender();
    if(AG.queued.length) AG.timer = setTimeout(agDrainQueue, 1200); }, 1200);
}
function agDecide(ok, feedback){
  const w = AG.wait; if(!w || w.kind!=='confirm') return; const e = w.e; AG.wait=null; AG.status='running';
  if(ok){ e.st='run'; agRender();

  } else { e.st='err'; e.out = feedback ? `用户拒绝，并补充：${feedback}` : '用户拒绝了这个操作';
    if(feedback) agEmit({t:'msg',r:'u',x:feedback,tag:'拒绝并补充意见'});
    agRender();

/* 飞书步骤：用户层缺 scope → Run 进入 waiting(auth) → 授权后自动重试同一调用 */
function agLark(){
  agSetPlan(5);

    e.st='err'; e.out='{"ok":false,"error":{"type":"permission","missing_scopes":["im:message"],"identity":"user"}}';
    const a = agEmit({t:'auth',layer:'user',conn:'lark',scopes:['im:message'],retry:e.id,st:'wait'});

  }, 900);
}
function agAuthDone(){

  AG.timer = setTimeout(()=>{ e.st='ok'; e.out='{"ok":true,"data":{"message_id":"om_5c2e…","chat":"apikey-hub 开发群"}}'; AG.cost+=.01; AG.tokens+=900;

function agAuthSkip(){

/* 示意二维码：确定性图案，只用于原型 */
function qrSvg(seed){
  let x = seed, cells = '';
  const rnd = () => (x = (x*1103515245+12345) & 0x7fffffff) % 100;
  const finder = (r,c) => [[0,0],[0,14],[14,0]].some(([a,b]) => r>=a && r<a+7 && c>=b && c<b+7);
  const finderOn = (r,c) => { for(const [a,b] of [[0,0],[0,14],[14,0]]){ if(r>=a&&r<a+7&&c>=b&&c<b+7){ const i=r-a, j=c-b; return i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4); } } return false; };
  for(let r=0;r<21;r++) for(let c=0;c<21;c++){ if(finder(r,c) ? finderOn(r,c) : rnd()<46) cells += `<rect x="${c}" y="${r}" width="1" height="1"/>`; }
  return `<svg viewBox="0 0 21 21" shape-rendering="crispEdges" fill="#111">${cells}</svg>`;
}

/* 把事件流组织成：用户消息 / Agent 消息（含步骤分组与工具行）/ 预检 / 产物 / 完成栏 */
function agBlocks(){
  const blocks = []; let cur = null;
  const ensure = () => { if(!cur){ cur = {t:'a', x:null, steps:[], tail:[]}; blocks.push(cur); } return cur; };
  for(const e of AG.events){
    if(e.t==='msg' && e.r==='u'){ blocks.push({t:'u', e}); cur = null; }
    else if(e.t==='msg'){ cur = {t:'a', x:e, steps:[], tail:[]}; blocks.push(cur); }
    else if(e.t==='pre'){ ensure().tail.push(e); }
    else if(e.t==='step'){ ensure().steps.push({i:e.i, items:[]}); }
    else if(e.t==='tool' || e.t==='auth'){ const b = ensure(); if(!b.steps.length) b.steps.push({i:e.step, items:[]}); b.steps[b.steps.length-1].items.push(e); }
    else if(e.t==='arts' || e.t==='done'){ ensure().tail.push(e); }
  }
  return blocks;
}

function renderAgPanel(){

    pb.innerHTML = `<pre class="term">${shells.map(x=>`<span class="cmd">$ ${esc(x.cmd)}</span>\n${x.st==='run'?'…':x.st==='wait'?'（等待确认）':`<span class="${x.st==='err'?'bad':''}">${esc(x.out||'')}</span>`}`).join('\n\n')}</pre>`;
  } else if(t==='arts'){
    pb.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px">${ARTS.map((a,k)=>`<button class="art" data-art="${k}"><span class="ic">${a.ab}</span><span style="min-width:0;flex:1"><b>${a.name}</b><small>${a.path} · ${a.kind} · ${a.size}</small></span></button>`).join('')}
      <p class="hint">产物同时写入本次 Run 的 note 事件，可在“运行”中回看。</p></div>`;

  }

function agOpenArt(k){

function agSend(mode){
  const ta = $('#ag-input'); const v = ta.value.trim(); if(!v) return; ta.value='';
  if(PAST[AG.view]){ toast('原型：会带上这个任务的上下文，开始新一轮执行'); return; }
  if(AG.wait?.kind==='confirm'){ agDecide(false, v); return; }
  if(AG.status==='running' || AG.wait?.kind==='auth'){
    if(mode==='queue'){ AG.queued.push({id:++AG.qseq, x:v}); agRender(); }
    else { agEmit({t:'msg',r:'u',x:v,tag:'插话',ij:'pending'}); agRender(); }
    return;
  }

function obsNote(id){
  const fm = (type, extra, tags) => `---\noe_id: ${id}\noe_type: ${type}\n${extra}tags: [${tags.join(', ')}]\nupdated: 2026-10-29\n---\n`;
  const kline = m => `- ${KINDS[m.kind].n}：${m.title}（[原对话](http://127.0.0.1:8765/runs/${m.ev.run}#${m.ev.i})）`;
  const foot = n => `\n\n<!-- 由 Open Evolve 生成，同步时会被覆盖。你的想法请写在其他笔记里，用 [[${n}]] 链接过来。 -->`;
  if(id.startsWith('proj:')){
    const p = id.slice(5), ms = MEM.filter(m=>m.project===p && memLive(m) && KNOW_KINDS.includes(m.kind));
    return fm('project','',['oe/project']) + `# ${p}\n\nconcepts:: ${conceptsOf(ms).map(c=>`[[${conceptById(c).label}]]`).join(', ')}\n\n## 知识\n${ms.map(kline).join('\n')}` + foot(p);
  }
  if(id.startsWith('lens:')){
    const D = domainById(id.slice(5)), ts = TOPICS.filter(t=>t.domain===D.id);
    return fm('domain','',[`oe/domain`]) + `# ${D.name}\n${D.desc}\n\ntopics:: ${ts.map(t=>`[[${t.name}]]`).join(', ')}` + foot(D.name);
  }
  const t = topicById(id);
  if(t){ const D = domainById(t.domain);
    return fm('topic',`domain: ${D.name}\n`,[`oe/topic`]) + `# ${t.name}\n\ndomain:: [[${D.name}]]\nconcepts:: ${CONCEPTS.filter(c=>c.topic===id).map(c=>`[[${c.label}]]`).join(', ')}` + foot(t.name); }
  const c = conceptById(id), ct = topicById(c.topic), D = domainById(ct.domain), ms = conceptMems(id), ps = conceptProjects(id);
  const rel = CLINKS.filter(([a,b])=>a===id||b===id).map(([a,b])=>`[[${conceptById(a===id?b:a).label}]]`);
  return fm('concept',`domain: ${D.name}\ntopic: ${ct.name}\nprojects: [${ps.join(', ')}]\n`,['oe/concept']) + `# ${c.label}\n${c.desc}\n\ntopic:: [[${ct.name}]]${rel.length?`\nrelated:: ${rel.join(', ')}`:''}${ps.length?`\nseen_in:: ${ps.map(p=>`[[${p}]]`).join(', ')}`:''}\n\n## 知识\n${ms.length?ms.map(kline).join('\n'):'- 只在对话中被提到'}` + foot(c.label);
}

let saved='system'; try{ saved = localStorage.getItem('oe-theme') || 'system'; }catch(_){}
applyTheme(saved);
render();
agStart();
